name: Google review auto-responder

# Checks for new Google reviews once a day at 9pm Melbourne time and replies to them.
# Also runnable by hand from the Actions tab ("Run workflow"), with an optional dry run.
on:
  schedule:
    # GitHub schedules are in UTC. 10:00 UTC = 9pm AEDT (daylight saving, Oct-Apr)
    # and 8pm AEST in winter. Use "0 11 * * *" for 9pm in winter instead.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (draft replies, post nothing)"
        type: boolean
        default: true

concurrency:
  group: review-agent
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: review-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: review-agent/requirements.txt

      - run: pip install -r requirements.txt

      # Remembers which held reviews we've already emailed you about, so you
      # don't get the same email every day.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: review-agent/state.json
          key: review-agent-state-${{ github.run_id }}
          restore-keys: review-agent-state-

      - name: Reply to new reviews
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_LOCATION: ${{ secrets.GOOGLE_LOCATION }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          # Every reply ends with this sign-off.
          SIGN_OFF: "Coastcom Security Team"
          # Reviews of every rating (1-5 stars) get an automatic reply. Sensitive ones
          # (incidents, disputes, legal, privacy...) are still held for you.
          # Raise this (e.g. to "3") to approve low-star replies yourself.
          AUTO_REPLY_MIN_STARS: "1"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python agent.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: review-agent/state.json
          key: review-agent-state-${{ github.run_id }}
